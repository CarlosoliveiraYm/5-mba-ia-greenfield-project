services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

# Named volume so the database survives `docker compose down`. Without it Postgres
# wrote to a throwaway anonymous volume and every teardown silently emptied the
# database, forcing a `npm run migration:run` on the next startup.
# To wipe it on purpose: `docker compose down -v`.
volumes:
  db-data:

# Shared network for the whole StreamTube stack. This Compose project owns it;
# next-frontend/compose.yaml joins the same network as `external`, which lets the
# frontend reach the API by its Compose service name (http://nestjs-api:3000).
# Consequence: start this stack before next-frontend.
networks:
  default:
    name: streamtube
