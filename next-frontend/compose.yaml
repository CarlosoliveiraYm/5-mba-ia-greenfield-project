services:
  next-frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3001:3000
    volumes:
      - .:/home/node/app

# Joins the shared network owned by nestjs-project/compose.yaml, so the API is
# reachable by its Compose service name (http://nestjs-api:3000).
# The backend stack must be up first, otherwise the network does not exist yet.
networks:
  default:
    name: streamtube
    external: true
